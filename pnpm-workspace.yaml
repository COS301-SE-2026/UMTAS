packages:
  - "apps/*"
  - "apps/pdf_parser/worker"
  - "packages/*"

# Allowlist for packages permitted to run lifecycle scripts during install.
allowBuilds:
  "@nestjs/core": true
  "@scarf/scarf": false
  "@swc/core": true
  esbuild: true
  msw: false
  msgpackr-extract: true
  napi-postinstall: true
  sharp: true
  unrs-resolver: true
