name: umtas-staging

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    networks:
      internal:
        aliases:
          - postgres-staging
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      internal:
        aliases:
          - redis-staging
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-10-25T06-33-25Z
    restart: unless-stopped
    networks:
      gateway:
      internal:
        aliases:
          - minio-staging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=gateway"
      - "traefik.http.routers.minio-staging.rule=Host(`staging.storage.capstone-vigil.dns.net.za`)"
      - "traefik.http.routers.minio-staging.entrypoints=websecure"
      - "traefik.http.routers.minio-staging.tls=true"
      - "traefik.http.routers.minio-staging.tls.certresolver=myresolver"
      - "traefik.http.services.minio-staging.loadbalancer.server.port=9001"
      - "com.centurylinklabs.watchtower.enable=true"

  pdf-parser-worker:
    image: ${DOCKER_REGISTRY:-vigilcs/umtas}:pdf-parser-worker-staging-${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    networks:
      - internal
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-staging:6379
      WORKER_BACKEND_URL: http://backend-staging:${BACKEND_PORT}
      WORKER_CALLBACK_TOKEN: ${WORKER_CALLBACK_TOKEN}
      WORKER_TEMP_ROOT: /tmp/worker-jobs
      MINIO_ENDPOINT: http://minio-staging:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-umtas-uploads}
      PDF_PARSE_CLI_COMMAND: python3
      PDF_PARSE_CLI_CWD: /app/python
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    tmpfs:
      - /tmp/worker-jobs:size=2G,mode=1770,uid=1000,gid=1000
    stop_grace_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  solver-worker:
    image: ${DOCKER_REGISTRY:-vigilcs/umtas}:solver-worker-staging-${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    networks:
      - internal
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-staging:6379
      WORKER_BACKEND_URL: http://backend-staging:${BACKEND_PORT}
      WORKER_CALLBACK_TOKEN: ${WORKER_CALLBACK_TOKEN}
      WORKER_TEMP_ROOT: /tmp/worker-jobs
      SOLVER_CLI_COMMAND: /app/bin/solver-cli
    depends_on:
      redis:
        condition: service_healthy
    tmpfs:
      - /tmp/worker-jobs:size=4G,mode=1770,uid=1000,gid=1000
    stop_grace_period: 330s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  backend:
    image: ${DOCKER_REGISTRY:-vigilcs/umtas}:backend-staging-${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      gateway:
      internal:
        aliases:
          - backend-staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - PORT=${BACKEND_PORT}
      - NODE_ENV=staging
      - NODE_OPTIONS=--dns-result-order=ipv4first --network-family-autoselection-attempt-timeout=2000
      - DATABASE_URL=${DATABASE_URL}
      - DB_MODE=${DB_MODE}
      - SEED=${SEED}
      - SEED_SYSTEM_ADMIN_NAME=${SEED_SYSTEM_ADMIN_NAME}
      - SEED_SYSTEM_ADMIN_EMAIL=${SEED_SYSTEM_ADMIN_EMAIL}
      - SEED_SYSTEM_ADMIN_PASSWORD=${SEED_SYSTEM_ADMIN_PASSWORD}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL
      - COOKIE_DOMAIN
      - COOKIE_PREFIX=${COOKIE_PREFIX}
      - BETTER_AUTH_TRUSTED_ORIGINS
      - CORS_ORIGIN
      - NEXT_PUBLIC_APP_URL
      - NEXT_PUBLIC_API_URL
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-staging:6379
      - WORKER_CALLBACK_TOKEN=${WORKER_CALLBACK_TOKEN}
      - MINIO_ENDPOINT=http://minio-staging:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET:-umtas-uploads}
      - SYSTEM_ADMIN_USER_IDS=${SYSTEM_ADMIN_USER_IDS}
      - SMTP_HOST=${SMTP_HOST:-mailhog}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-UMTAS <noreply@${STG_APP_DOMAIN}>}
      - SIMULATION_API_KEY=${SIMULATION_API_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=gateway"
      - "traefik.http.routers.backend-staging.rule=Host(`staging.capstone-vigil.dns.net.za`) && PathPrefix(`/api`)"
      # - "traefik.http.routers.umtas-staging.middlewares=api-stripprefix"
      # - "traefik.http.middlewares.api-stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.backend-staging.entrypoints=websecure"
      - "traefik.http.routers.backend-staging.tls=true"
      - "traefik.http.routers.backend-staging.tls.certresolver=myresolver"
      - "traefik.http.services.backend-staging.loadbalancer.server.port=${BACKEND_PORT}"
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.http.routers.backend-staging.priority=100"

  frontend:
    image: ${DOCKER_REGISTRY:-vigilcs/umtas}:frontend-staging-${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      gateway:
      internal:
        aliases:
          - frontend-staging
    environment:
      - PORT=${FRONTEND_PORT}
      - API_URL=http://backend-staging:${BACKEND_PORT}
      - COOKIE_PREFIX=umtas-staging
      - NEXT_PUBLIC_POSTHOG_PT=${NEXT_PUBLIC_POSTHOG_PT}
      - NEXT_PUBLIC_POSTHOG_API_HOST=${NEXT_PUBLIC_POSTHOG_API_HOST}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=gateway"
      - "traefik.http.routers.frontend-staging.rule=Host(`staging.capstone-vigil.dns.net.za`)"
      - "traefik.http.routers.frontend-staging.entrypoints=websecure"
      - "traefik.http.routers.frontend-staging.tls=true"
      - "traefik.http.routers.frontend-staging.tls.certresolver=myresolver"
      - "traefik.http.services.frontend-staging.loadbalancer.server.port=${FRONTEND_PORT}"
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.http.routers.frontend-staging.priority=1"

  # watchtower:
  #   image: containrrr/watchtower
