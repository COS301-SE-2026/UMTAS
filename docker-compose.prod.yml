name: umtas-prod

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    networks:
      data-internal:
        aliases:
          - postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      data-internal:
        aliases:
          - redis-prod
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-10-25T06-33-25Z
    restart: unless-stopped
    networks:
      gateway:
      data-internal:
        aliases:
          - minio-prod
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=gateway"
      - "traefik.http.routers.minio-prod.rule=Host(`storage.${DOMAIN}`)"
      - "traefik.http.routers.minio-prod.entrypoints=websecure"
      - "traefik.http.routers.minio-prod.tls=true"
      - "traefik.http.routers.minio-prod.tls.certresolver=myresolver"
      - "traefik.http.services.minio-prod.loadbalancer.server.port=9001"

  pdf-parser-worker:
    image: ${DOCKER_REGISTRY:-vigilcs/umtas}:pdf-parser-worker-${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    init: true
    networks:
      - data-internal
      - app-internal
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-prod:6379
      WORKER_BACKEND_URL: http://backend-prod:${BACKEND_PORT}
      WORKER_CALLBACK_TOKEN: ${WORKER_CALLBACK_TOKEN:?WORKER_CALLBACK_TOKEN must be set in production}
      WORKER_TEMP_ROOT: /tmp/worker-jobs
      MINIO_ENDPOINT: http://minio-prod:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-umtas-uploads}
      PDF_PARSE_CLI_COMMAND: python3
      PDF_PARSE_CLI_CWD: /app/python
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    tmpfs:
      - /tmp/worker-jobs:size=2G,mode=1770,uid=1000,gid=1000
    stop_grace_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M

  solver-worker:
    image: ${DOCKER_REGISTRY:-vigilcs/umtas}:solver-worker-${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    init: true
    networks:
      - data-internal
      - app-internal
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-prod:6379
      WORKER_BACKEND_URL: http://backend-prod:${BACKEND_PORT}
      WORKER_CALLBACK_TOKEN: ${WORKER_CALLBACK_TOKEN:?WORKER_CALLBACK_TOKEN must be set in production}
      WORKER_TEMP_ROOT: /tmp/worker-jobs
      SOLVER_CLI_COMMAND: /app/bin/solver-cli
    depends_on:
      redis:
        condition: service_healthy
    tmpfs:
      - /tmp/worker-jobs:size=4G,mode=1770,uid=1000,gid=1000
    stop_grace_period: 330s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M

  backend:
    image: ${DOCKER_REGISTRY:-vigilcs/umtas}:backend-${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    networks:
      gateway:
      data-internal:
      app-internal:
        aliases:
          - backend-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - PORT=${BACKEND_PORT}
      - NODE_ENV=production
      - NODE_OPTIONS=--dns-result-order=ipv4first --network-family-autoselection-attempt-timeout=2000
      - DATABASE_URL=${DATABASE_URL}
      - DB_MODE=${DB_MODE}
      - SEED=${SEED}
      - SEED_COS_ADMIN_EMAIL=${SEED_COS_ADMIN_EMAIL}
      - SEED_COS_ADMIN_PASSWORD=${SEED_COS_ADMIN_PASSWORD}
      - SEED_SYSTEM_ADMIN_NAME=${SEED_SYSTEM_ADMIN_NAME}
      - SEED_SYSTEM_ADMIN_EMAIL=${SEED_SYSTEM_ADMIN_EMAIL}
      - SEED_SYSTEM_ADMIN_PASSWORD=${SEED_SYSTEM_ADMIN_PASSWORD}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL
      - COOKIE_DOMAIN
      - COOKIE_PREFIX=${COOKIE_PREFIX}
      - BETTER_AUTH_TRUSTED_ORIGINS
      - SEED_COS_ADMIN_EMAIL=${SEED_COS_ADMIN_EMAIL}
      - SEED_COS_ADMIN_PASSWORD=${SEED_COS_ADMIN_PASSWORD}
      - CORS_ORIGIN
      - NEXT_PUBLIC_APP_URL
      - NEXT_PUBLIC_API_URL
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-prod:6379
      - WORKER_CALLBACK_TOKEN=${WORKER_CALLBACK_TOKEN:?WORKER_CALLBACK_TOKEN must be set in production}
      - MINIO_ENDPOINT=http://minio-prod:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET:-umtas-uploads}
      - SYSTEM_ADMIN_USER_IDS=${SYSTEM_ADMIN_USER_IDS}
      - SMTP_HOST=${SMTP_HOST:-mailhog}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-UMTAS <noreply@${PROD_APP_DOMAIN}>}
      - SIMULATION_API_KEY=${SIMULATION_API_KEY}
      - ORS_API_KEY=${ORS_API_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=gateway"
      - "traefik.http.routers.backend-prod.rule=Host(`capstone-vigil.dns.net.za`) && PathPrefix(`/api`)"
      # - "traefik.http.routers.umtas-prod.middlewares=api-stripprefix"
      # - "traefik.http.middlewares.api-stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.backend-prod.entrypoints=websecure"
      - "traefik.http.routers.backend-prod.tls=true"
      - "traefik.http.routers.backend-prod.tls.certresolver=myresolver"
      - "traefik.http.services.backend-prod.loadbalancer.server.port=${BACKEND_PORT}"
      - "traefik.http.routers.backend-prod.priority=100"

  frontend:
    image: ${DOCKER_REGISTRY:-vigilcs/umtas}:frontend-${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    networks:
      gateway:
      app-internal:
        aliases:
          - frontend-prod
    depends_on:
      - backend
    environment:
      - PORT=${FRONTEND_PORT}
      - API_URL=http://backend-prod:${BACKEND_PORT}
      - COOKIE_PREFIX=umtas-production
      - NEXT_PUBLIC_POSTHOG_PT=${NEXT_PUBLIC_POSTHOG_PT}
      - NEXT_PUBLIC_POSTHOG_API_HOST=${NEXT_PUBLIC_POSTHOG_API_HOST}
      - NEXT_PUBLIC_MAP_KEY=${NEXT_PUBLIC_MAP_KEY}
      - NEXT_PUBLIC_MAP_ID=${NEXT_PUBLIC_MAP_ID}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=gateway"
      - "traefik.http.routers.frontend-prod.rule=Host(`${PROD_APP_DOMAIN}`)"
      - "traefik.http.routers.frontend-prod.entrypoints=websecure"
      - "traefik.http.routers.frontend-prod.tls=true"
      - "traefik.http.routers.frontend-prod.tls.certresolver=myresolver"
      - "traefik.http.services.frontend-prod.loadbalancer.server.port=${FRONTEND_PORT}"

  # brand-style:
  #   image: vigilcs/umtas-brand-style:latest
  #   restart: unless-stopped
  #   networks:
  #     - gateway
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.docker.network=gateway"
  #     - "traefik.http.routers.brand-style-prod.rule=Host(`brand.${DOMAIN}`)"
  #     - "traefik.http.routers.brand-style-prod.entrypoints=websecure"
  #     - "traefik.http.routers.brand-style-prod.tls=true"
  #     - "traefik.http.routers.brand-style-prod.tls.certresolver=myresolver"
  #     - "traefik.http.services.brand-style-prod.loadbalancer.server.port=6767"

  grafana:
    image: grafana/grafana:10.4.3
    restart: unless-stopped
    networks:
      gateway:
      observability-internal:
        aliases:
          - grafana-prod
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/home.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=gateway"
      - "traefik.http.routers.grafana-prod.rule=Host(`grafana.${DOMAIN}`)"
      - "traefik.http.routers.grafana-prod.entrypoints=websecure"
      - "traefik.http.routers.grafana-prod.tls=true"
      - "traefik.http.routers.grafana-prod.tls.certresolver=myresolver"
      - "traefik.http.services.grafana-prod.loadbalancer.server.port=3000"

  prometheus:
    image: prom/prometheus:v3.4.0
    restart: unless-stopped
    networks:
      - gateway
      - app-internal
      - observability-internal
    volumes:
      - ./infra/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    entrypoint: ["/etc/prometheus/docker-entrypoint.sh"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"

  loki:
    image: grafana/loki:3.4.3
    restart: unless-stopped
    networks:
      - observability-internal
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/loki:/etc/loki
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.4.3
    restart: unless-stopped
    networks:
      - observability-internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./infra/promtail/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  health-exporter:
    image: fviolence/docker-health-exporter:latest
    restart: unless-stopped
    networks:
      - observability-internal
    environment:
      - PORT=9066
      - SCRAPE_INTERVAL=15
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    networks:
      - observability-internal
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /run/udev:/run/udev:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    networks:
      - observability-internal
    devices:
      - /dev/kmsg
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    command:
      - "--docker_only=true"
      - "--store_container_labels=true"
      - "--disable_metrics=advtcp,app,cpu,cpuLoad,diskIO,hugetlb,memory,network,oom_event,percpu,perf_event,process,referenced_memory,resctrl,sched,tcp,udp"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    networks:
      - data-internal
      - observability-internal
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

networks:
  gateway:
    external: true
  data-internal:
    name: umtas-prod-data-internal
    driver: bridge
  app-internal:
    name: umtas-prod-app-internal
    driver: bridge
  observability-internal:
    name: umtas-prod-observability-internal
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  grafana_data:
  prometheus_data:
  loki_data:
