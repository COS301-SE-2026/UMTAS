name: umtas-prod

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    networks:
      - internal
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/database/seeds.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-10-25T06-33-25Z
    restart: unless-stopped
    networks:
      - gateway
      - internal
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=gateway"
      - "traefik.http.routers.minio-prod.rule=Host(`storage.${DOMAIN}`)"
      - "traefik.http.routers.minio-prod.entrypoints=websecure"
      - "traefik.http.routers.minio-prod.tls=true"
      - "traefik.http.routers.minio-prod.tls.certresolver=myresolver"
      - "traefik.http.services.minio-prod.loadbalancer.server.port=9001"

  solver:
    image: ${DOCKER_REGISTRY:-vigilcs/umtas}:solver-${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - gateway
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.solver-prod.rule=Host(`solver.${DOMAIN}`)"
      - "traefik.http.routers.solver-prod.entrypoints=websecure"
      - "traefik.http.routers.solver-prod.tls=true"
      - "traefik.http.routers.solver-prod.tls.certresolver=myresolver"
      - "traefik.http.services.solver-prod.loadbalancer.server.port=8000"

  backend:
    image: ${DOCKER_REGISTRY:-vigilcs/umtas}:backend-${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - gateway
      - internal
    environment:
      - PORT=${BACKEND_PORT}
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - DB_MODE=${DB_MODE}
      - SEED=${SEED}
      - SEED_TASKS=${SEED_TASKS}
      - SEED_SYSTEM_ADMIN_NAME=${SEED_SYSTEM_ADMIN_NAME}
      - SEED_SYSTEM_ADMIN_EMAIL=${SEED_SYSTEM_ADMIN_EMAIL}
      - SEED_SYSTEM_ADMIN_PASSWORD=${SEED_SYSTEM_ADMIN_PASSWORD}
      - SEED_TEST_PASSWORD=${SEED_TEST_PASSWORD}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=https://api.${DOMAIN}
      - COOKIE_DOMAIN=.${DOMAIN}
      - BETTER_AUTH_TRUSTED_ORIGINS=https://${DOMAIN}
      - CORS_ORIGIN=https://${DOMAIN}
      - NEXT_PUBLIC_APP_URL=https://${DOMAIN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - REDIS_URL=${REDIS_URL}
      - SYSTEM_ADMIN_USER_IDS=${SYSTEM_ADMIN_USER_IDS}
      - SMTP_HOST=${SMTP_HOST:-mailhog}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-UMTAS <noreply@${DOMAIN}>}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=gateway"
      - "traefik.http.routers.backend-prod.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.backend-prod.entrypoints=websecure"
      - "traefik.http.routers.backend-prod.tls=true"
      - "traefik.http.routers.backend-prod.tls.certresolver=myresolver"
      - "traefik.http.services.backend-prod.loadbalancer.server.port=${BACKEND_PORT}"

  frontend:
    image: ${DOCKER_REGISTRY:-vigilcs/umtas}:frontend-${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - gateway
    environment:
      - PORT=${FRONTEND_PORT}
      - API_URL=http://backend:${BACKEND_PORT}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend-prod.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend-prod.entrypoints=websecure"
      - "traefik.http.routers.frontend-prod.tls=true"
      - "traefik.http.routers.frontend-prod.tls.certresolver=myresolver"
      - "traefik.http.services.frontend-prod.loadbalancer.server.port=${FRONTEND_PORT}"

  brand-style:
    image: vigilcs/umtas-brand-style:latest
    restart: unless-stopped
    networks:
      - gateway
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=gateway"
      - "traefik.http.routers.brand-style-prod.rule=Host(`brand.${DOMAIN}`)"
      - "traefik.http.routers.brand-style-prod.entrypoints=websecure"
      - "traefik.http.routers.brand-style-prod.tls=true"
      - "traefik.http.routers.brand-style-prod.tls.certresolver=myresolver"
      - "traefik.http.services.brand-style-prod.loadbalancer.server.port=6767"

  grafana:
    image: grafana/grafana:10.4.3
    restart: unless-stopped
    networks:
      - gateway
      - internal
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/home.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana-prod.rule=Host(`grafana.${DOMAIN}`)"
      - "traefik.http.routers.grafana-prod.entrypoints=websecure"
      - "traefik.http.routers.grafana-prod.tls=true"
      - "traefik.http.routers.grafana-prod.tls.certresolver=myresolver"
      - "traefik.http.services.grafana-prod.loadbalancer.server.port=3000"

networks:
  gateway:
    external: true
  internal:
    name: umtas-prod-internal
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  grafana_data:
