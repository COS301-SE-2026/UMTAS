networks:
  gateway:
    name: gateway
    driver: bridge
  internal:
    name: internal
    internal: true

volumes:
  postgres_data:
  minio_data:
  redis_data:
  grafana_data:
  prometheus_data:
  loki_data:
  letsencrypt_data:

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    networks:
      - gateway
      - internal
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/database/seeds.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - gateway
      - internal
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-10-25T06-33-25Z
    restart: unless-stopped
    networks:
      - gateway
      - internal
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
  mailhog:
    image: mailhog/mailhog:v1.0.1
    networks:
      - gateway
      - internal
    ports:
      - "1025:1025"
      - "8025:8025"
    profiles:
      - dev-docker
      - dev-infra
      - dev-pglite

  pdf-parser-worker:
    build:
      context: .
      dockerfile: docker/pdf-parser-worker/pdf-parser-worker.Dockerfile
    image: ${DOCKER_REGISTRY:-vigilcs/umtas}:pdf-parser-worker-${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    networks:
      - internal
      - gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BULLMQ_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PDF_PARSE_QUEUE_NAME: ${PDF_PARSE_QUEUE_NAME:-pdf.parse}
      PDF_PARSE_CONCURRENCY: ${PDF_PARSE_CONCURRENCY:-2}
      PDF_PARSE_TIMEOUT_MS: ${PDF_PARSE_TIMEOUT_MS:-60000}
      PDF_PARSE_CALLBACK_URL: ${WORKER_BACKEND_URL:-http://backend:${BACKEND_PORT:-3001}}/pdf-parser/jobs
      WORKER_CALLBACK_TOKEN: ${WORKER_CALLBACK_TOKEN}
      WORKER_TOPOLOGY: container
      WORKER_KEEP_FAILED_TEMP: ${WORKER_KEEP_FAILED_TEMP:-false}
      MINIO_BUCKET: ${MINIO_BUCKET:-umtas-uploads}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      PDF_PARSE_CLI_COMMAND: python3
      PDF_PARSE_CLI_ARGS: -m parser_cli
      PDF_PARSE_CLI_CWD: /app/python
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    stop_grace_period: 90s
    profiles:
      - dev-docker
      - dev-infra
      - dev-pglite
      - server

  solver-worker:
    build:
      context: .
      dockerfile: docker/solver-worker/solver-worker.Dockerfile
    image: ${DOCKER_REGISTRY:-vigilcs/umtas}:solver-worker-${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    networks:
      - internal
      - gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BULLMQ_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      TIMETABLE_SOLVE_QUEUE_NAME: ${TIMETABLE_SOLVE_QUEUE_NAME:-timetable.solve}
      SOLVER_CONCURRENCY: ${SOLVER_CONCURRENCY:-1}
      SOLVER_TIMEOUT_MS: ${SOLVER_TIMEOUT_MS:-300000}
      SOLVER_INPUT_URL: ${WORKER_BACKEND_URL:-http://backend:${BACKEND_PORT:-3001}}/solver/jobs
      SOLVER_CALLBACK_URL: ${WORKER_BACKEND_URL:-http://backend:${BACKEND_PORT:-3001}}/solver/jobs
      WORKER_CALLBACK_TOKEN: ${WORKER_CALLBACK_TOKEN}
      WORKER_TOPOLOGY: container
      WORKER_KEEP_FAILED_TEMP: ${WORKER_KEEP_FAILED_TEMP:-false}
      SOLVER_CLI_COMMAND: /app/bin/solver-cli
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 330s
    profiles:
      - dev-docker
      - dev-infra
      - dev-pglite
      - server

  backend:
    build:
      context: .
      dockerfile: docker/backend/backend.Dockerfile
    image: ${DOCKER_REGISTRY:-vigilcs/umtas}:backend-${IMAGE_TAG:-latest}
    networks:
      - gateway
      - internal
    environment:
      - PORT=${BACKEND_PORT}
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - DB_MODE=${DB_MODE}
      - SEED=${SEED}
      - SEED_TASKS=${SEED_TASKS}
      - SEED_SYSTEM_ADMIN_NAME=${SEED_SYSTEM_ADMIN_NAME}
      - SEED_SYSTEM_ADMIN_EMAIL=${SEED_SYSTEM_ADMIN_EMAIL}
      - SEED_SYSTEM_ADMIN_PASSWORD=${SEED_SYSTEM_ADMIN_PASSWORD}
      - SEED_TEST_PASSWORD=${SEED_TEST_PASSWORD}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://api.${DOMAIN}}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-.${DOMAIN}}
      - BETTER_AUTH_TRUSTED_ORIGINS=${BETTER_AUTH_TRUSTED_ORIGINS:-https://${DOMAIN}}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://${DOMAIN}}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://${DOMAIN}}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - BULLMQ_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - PDF_PARSE_QUEUE_NAME=${PDF_PARSE_QUEUE_NAME:-pdf.parse}
      - TIMETABLE_SOLVE_QUEUE_NAME=${TIMETABLE_SOLVE_QUEUE_NAME:-timetable.solve}
      - PDF_PARSE_ATTEMPTS=${PDF_PARSE_ATTEMPTS:-3}
      - PDF_PARSE_BACKOFF_DELAY_MS=${PDF_PARSE_BACKOFF_DELAY_MS:-5000}
      - TIMETABLE_SOLVE_ATTEMPTS=${TIMETABLE_SOLVE_ATTEMPTS:-2}
      - TIMETABLE_SOLVE_BACKOFF_DELAY_MS=${TIMETABLE_SOLVE_BACKOFF_DELAY_MS:-10000}
      - WORKER_CALLBACK_TOKEN=${WORKER_CALLBACK_TOKEN}
      - MINIO_BUCKET=${MINIO_BUCKET:-umtas-uploads}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_CREATE_BUCKET_ON_STARTUP=${MINIO_CREATE_BUCKET_ON_STARTUP:-true}
      - SYSTEM_ADMIN_USER_IDS=${SYSTEM_ADMIN_USER_IDS}
      - SMTP_HOST=${SMTP_HOST:-mailhog}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-UMTAS <noreply@${DOMAIN}>}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://127.0.0.1:''+process.env.PORT+''/health'',r=>process.exit(r.statusCode<500?0:1)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    profiles:
      - dev-docker
      - dev-pglite
      - server

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/frontend.Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.${DOMAIN}}
    image: ${DOCKER_REGISTRY:-vigilcs/umtas}:frontend-${IMAGE_TAG:-latest}
    networks:
      - gateway
    environment:
      - API_URL=http://backend:${BACKEND_PORT}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const os=require('os');const ip=Object.values(os.networkInterfaces()).flat().find((a)=>a.family==='IPv4'&&!a.internal)?.address;if(!ip) process.exit(1);require('http').get('http://'+ip+':'+process.env.PORT+'/api/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    profiles:
      - dev-docker
      - dev-pglite
      - server

  grafana:
    image: grafana/grafana:10.4.3
    restart: unless-stopped
    networks:
      - gateway
      - internal
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/home.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    profiles:
      - server

  prometheus:
    image: prom/prometheus:v3.4.0
    restart: unless-stopped
    networks:
      - internal
    environment:
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN}
    volumes:
      - ./infra/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    entrypoint: ["/etc/prometheus/docker-entrypoint.sh"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    profiles:
      - server

  loki:
    image: grafana/loki:3.4.3
    restart: unless-stopped
    networks:
      - internal
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/loki:/etc/loki
      - loki_data:/loki
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    profiles:
      - server

  promtail:
    image: grafana/promtail:3.4.3
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./infra/promtail/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    profiles:
      - server

  health-exporter:
    image: fviolence/docker-health-exporter:latest
    restart: unless-stopped
    networks:
      - internal
    environment:
      - PORT=9066
      - SCRAPE_INTERVAL=15
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    profiles:
      - server

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /run/udev:/run/udev:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    profiles:
      - server

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    networks:
      - internal
    devices:
      - /dev/kmsg
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    command:
      - "--docker_only=true"
      - "--store_container_labels=true"
      - "--disable_metrics=advtcp,app,cpu,cpuLoad,diskIO,hugetlb,memory,network,oom_event,percpu,perf_event,process,referenced_memory,resctrl,sched,tcp,udp"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    profiles:
      - server

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    networks:
      - internal
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    profiles:
      - server
