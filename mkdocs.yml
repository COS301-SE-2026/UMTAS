site_name: UMTAS Documentation
site_url: https://cos301-se-2026.github.io/UMTAS/
extra_css:
  - stylesheets/extra.css

theme:
  name: material
  logo: assets/LOGOS/VigilOWL-removebg-preview.png
  favicon: assets/LOGOS/VigilOWL-removebg-preview.png
  icon:
    logo: material/owl
  palette:
    scheme: default
    primary: white
    accent: black
  font:
    text: Inter
    code: Fira Code
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - glightbox
  - drawio
  - swagger-ui-tag
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true
  - include-markdown

markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - SRS:
      - Overview: srs/index.md
      - User Stories: srs/USER_STORIES.md
      - Use Cases: srs/USE_CASES.md
      - Functional Requirements: srs/FUNCTIONAL_REQUIREMENTS.md
      - Non-Functional Requirements: srs/NON-FUNCTIONAL_REQUIREMENTS.md
      - Domain Model: srs/DOMAIN_MODEL.md
      - Traceability Matrix: srs/Traceability-Matrix.md
  - SAS:
      - Overview: sas/index.md
      - Architectural Requirements: sas/architecture/ARCHITECTURAL_REQUIREMENTS.md
      - Architectural Patterns: sas/architecture/ARCHITECTURAL_PATTERNS.md
      - Design Patterns: sas/architecture/DESIGN_PATTERNS.md
      - Constraints: sas/architecture/CONSTRAINTS.md
      - Architectural Diagram: sas/architecture/ARCHITECTURAL_DIAGRAM.md
      - Quality Requirement Mapping: sas/architecture/QUALITY_REQUIREMENT_MAPPING.md
      - Technology Requirements: sas/architecture/TECHNOLOGY_REQUIREMENTS.md
      - API Contracts: sas/architecture/API_CONTRACTS.md
      - Deployment:
          - Overview: sas/deployment/index.md
          - Live, Accessible System: sas/deployment/LiveAccessibleSystem.md
          - Environment Parity: sas/deployment/EnvironmentParity.md
          - Infrastructure as Code: sas/deployment/InfrastructureAsCode.md
          - Secrets Management: sas/deployment/SecretsManagement.md
          - Rollback Strategy: sas/deployment/RollBackStrategy.md
          - Deployment Diagram: sas/deployment/DeploymentDiagram.md
          - CI/CD Pipeline Diagram: sas/deployment/PipelineDiagram.md
  - Admin:
      - Marking Guide: management/Marking-Guide.md
      - Team Profiles: management/Team-Profiles.md
