global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    environment: production
    project: umtas

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: traefik
    static_configs:
      # No static `service` label: it would clobber Traefik's own service label.
      - targets: ["traefik:8082"]

  - job_name: backend
    static_configs:
      - targets: ["backend-prod:8000"]
        labels:
          service: backend
          language: nestjs
    metrics_path: /metrics

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node-exporter

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: cadvisor
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_service]
        target_label: compose_service

  - job_name: health-exporter
    static_configs:
      - targets: ["health-exporter:9066"]
        labels:
          service: health-exporter

  - job_name: public-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["https://capstone-vigil.dns.net.za/"]
        labels:
          service: frontend
      - targets: ["https://capstone-vigil.dns.net.za/api/health/ready"]
        labels:
          service: backend-readiness
      - targets: ["http://minio-prod:9000/health"]
        labels:
          service: storage
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
