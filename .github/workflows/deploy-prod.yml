name: Deploy Production Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to deploy,eg v1.0.0"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions: {}
    outputs:
      status: ${{ job.status }}
    steps:
      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          port: ${{ secrets.PROD_SSH_PORT }}
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/UMTAS
            just deploy-prod "${{ inputs.release_tag }}"

  notify-deploy:
    needs: deploy
    permissions: {}
    if: always()
    uses: ./.github/workflows/discord-notify.yml
    with:
      status: ${{ needs.deploy.result == 'success' && 'Success' || needs.deploy.result == 'cancelled' && 'Cancelled' || 'Failure' }}
      message: "Deploy step for ${{ inputs.release_tag }} to production finished with result: ${{ needs.deploy.result }}."
    secrets: inherit

  prod-health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    needs: deploy
    environment:
      name: production
    permissions: {}
    outputs:
      status: ${{ job.status }}
    steps:
      - name: Wait for containers to stabilize
        run: sleep 30

      - name: Check production health endpoints
        env:
          DOMAIN: ${{ secrets.PROD_DOMAIN }}
        run: |
          failed=0
          check() {
            local url=$1
            for attempt in 1 2 3 4 5; do
              status=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 10 "$url")
              if [ "$status" = "200" ]; then
                echo "OK: $url returned HTTP 200"
                return 0
              fi
              echo "Attempt $attempt/5: $url returned HTTP $status"
              [ "$attempt" -lt 5 ] && sleep 20
            done
            return 1
          }

          check "https://api.${DOMAIN}/health"    || failed=1
          check "https://solver.${DOMAIN}/health" || failed=1
          check "https://${DOMAIN}/api/health"    || failed=1

          exit $failed

      - name: Record last known-good release
        uses: appleboy/ssh-action@v1.0.3
        with:
          port: ${{ secrets.PROD_SSH_PORT }}
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            echo "${{ inputs.release_tag }}" > /opt/UMTAS/.last_good_tag
            echo "Recorded ${{ inputs.release_tag }} as last known-good release"

  notify-prod-health-check:
    needs: [deploy, prod-health-check]
    permissions: {}
    if: always() && needs.deploy.result == 'success'
    uses: ./.github/workflows/discord-notify.yml
    with:
      status: ${{ needs['prod-health-check'].result == 'success' && 'Success' || needs['prod-health-check'].result == 'cancelled' && 'Cancelled' || 'Failure' }}
      message: "Health check for ${{ inputs.release_tag }} on production finished with result: ${{ needs['prod-health-check'].result }}."
    secrets: inherit

  rollback-prod:
    name: Automatic Rollback
    runs-on: ubuntu-latest
    needs: [deploy, prod-health-check]
    if: needs.deploy.result == 'success' && needs['prod-health-check'].result == 'failure'
    environment:
      name: production
    permissions: {}
    outputs:
      status: ${{ job.status }}
    steps:
      - name: Roll back to last known-good release
        uses: appleboy/ssh-action@v1.0.3
        with:
          port: ${{ secrets.PROD_SSH_PORT }}
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/UMTAS
            if [ -f .last_good_tag ]; then
              PREV_TAG=$(cat .last_good_tag)
              echo "prev good release: $PREV_TAG :) "
              just rollback-prod "$PREV_TAG"
            else
              echo "No last good tag, need manual intervention for rollback :("
              exit 1
            fi

  notify-rollback:
    needs: rollback-prod
    permissions: {}
    if: always() && needs.rollback-prod.result != 'skipped'
    uses: ./.github/workflows/discord-notify.yml
    with:
      status: ${{ needs.rollback-prod.result == 'success' && 'Success' || 'Failure' }}
      message: "Automatic rollback triggered after ${{ inputs.release_tag }} failed its production health check."
    secrets: inherit
