name: Deploy Production Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to deploy,eg V1.0.0"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions: {}
    outputs:
      status: ${{ job.status }}
    steps:
      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          port: ${{ secrets.PROD_SSH_PORT }}
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/UMTAS
            docker compose -f docker-compose.prod.yml pull
            just prod-down
            just prod-up ${{ inputs.release_tag }}

  notify-deploy:
    needs: deploy
    permissions: {}
    if: always()
    uses: ./.github/workflows/discord-notify.yml
    with:
      status: ${{ needs.deploy.result == 'success' && 'Success' || 'Failure' }}
      message: "Deployment of ${{ inputs.release_tag }} to production attempt."
    secrets: inherit
