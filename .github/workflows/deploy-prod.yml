name: Deploy Production Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to deploy,eg V1.0.0"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions: {}
    steps:
      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/umtas
            phase run -- just deploy-prod "${{ inputs.release_tag }}"
