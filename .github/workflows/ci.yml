name: CI / CD Pipeline

on:
  push:
    branches:
      - main
      - feat/health-points
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    permissions:
      contents: read
      checks: write
    outputs:
      status: ${{ job.status }}
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: ${{ startsWith(github.ref, 'refs/tags/v') && format('https://api.{0}', secrets.PROD_DOMAIN) || format('https://staging.api.{0}', secrets.STAGING_DOMAIN) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Setup Just
        uses: extractions/setup-just@v2

      - name: Enable Corepack (pnpm)
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm run lint

      - name: Run Build
        run: pnpm run build

      # - name: Run Tests
      #   run: pnpm run test:unit

      # - name: Run Integration Tests
      #   run: pnpm --filter backend test:int

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "**/junit.xml"

  docker-check:
    name: Validate Docker Builds (PR)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'pull_request'
    environment:
      name: staging
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: umtas_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/backend/backend.Dockerfile
          push: false
          load: true
          tags: umtas-backend:ci
          cache-from: type=gha,scope=backend-main

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/frontend/frontend.Dockerfile
          push: false
          load: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://staging.api.${{ secrets.STAGING_DOMAIN }}
          tags: umtas-frontend:ci
          cache-from: type=gha,scope=frontend-main

  docker-staging:
    name: Build & Push Staging Images
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    environment:
      name: staging
    permissions:
      contents: read
    outputs:
      status: ${{ job.status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tags
        id: tag
        run: |
          echo "latest=latest" >> $GITHUB_OUTPUT
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/backend/backend.Dockerfile
          push: true
          tags: |
            vigilcs/umtas:backend-staging-${{ steps.tag.outputs.latest }}
            vigilcs/umtas:backend-staging-${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=backend-staging
          cache-to: type=gha,mode=max,scope=backend-staging

      - name: Build & push frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/frontend/frontend.Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://staging.api.capstone-vigil.dns.net.za/api
          tags: |
            vigilcs/umtas:frontend-staging-${{ steps.tag.outputs.latest }}
            vigilcs/umtas:frontend-staging-${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=frontend-staging
          cache-to: type=gha,mode=max,scope=frontend-staging

      - name: Build & push solver
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/solver-worker/solver-worker.Dockerfile
          push: true
          tags: |
            vigilcs/umtas:solver-staging-${{ steps.tag.outputs.latest }}
            vigilcs/umtas:solver-staging-${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=solver-staging
          cache-to: type=gha,mode=max,scope=solver-staging

  deploy-staging:
    runs-on: ubuntu-latest
    name: Deploy to Staging
    needs: docker-staging
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    environment:
      name: production
    permissions: {}
    steps:
      - name: Execute deployment on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          port: ${{ secrets.PROD_SSH_PORT }}
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/UMTAS
            docker compose -f docker-compose.staging.yml pull
            just staging-up

  docker-release:
    name: Build & Push Release Images
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
    permissions:
      contents: read
    outputs:
      status: ${{ job.status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve release tag
        id: tag
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          echo "release=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/backend/backend.Dockerfile
          push: true
          tags: |
            vigilcs/umtas:backend-${{ steps.tag.outputs.release }}
            vigilcs/umtas:backend-${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=backend-release
          cache-to: type=gha,mode=max,scope=backend-release

      - name: Build & push frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/frontend/frontend.Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.${{ secrets.PROD_DOMAIN }}
          tags: |
            vigilcs/umtas:frontend-${{ steps.tag.outputs.release }}
            vigilcs/umtas:frontend-${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=frontend-release
          cache-to: type=gha,mode=max,scope=frontend-release

      - name: Build & push solver
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/solver-worker/solver-worker.Dockerfile
          push: true
          tags: |
            vigilcs/umtas:solver-${{ steps.tag.outputs.release }}
            vigilcs/umtas:solver-${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=solver-release
          cache-to: type=gha,mode=max,scope=solver-release

  health-check:
    name: Staging Health Check
    runs-on: ubuntu-latest
    needs: docker-staging
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main'))
    environment:
      name: staging
    permissions: {}
    outputs:
      status: ${{ job.status }}

    steps:
      - name: Wait for Watchtower redeploy
        run: |
          echo "Waiting 60s for Watchtower to pull and restart containers..."
          sleep 60

      - name: Check staging health endpoints
        env:
          DOMAIN: ${{ secrets.STAGING_DOMAIN }}
        run: |
          failed=0
            check() {
            local url=$1
            local attempt
            for attempt in 1 2 3 4 5; do
              status=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 10 "$url")
              if [ "$status" = "200" ]; then
                echo "OK: $url returned HTTP 200"
                return 0
              fi
              echo "Attempt $attempt/5: $url returned HTTP $status"
              [ "$attempt" -lt 5 ] && sleep 20
            done
            echo "FAIL: $url did not return HTTP 200 after 5 attempts"
            return 1
          }

          check "https://staging.api.${DOMAIN}/health"    || failed=1
          check "https://staging.solver.${DOMAIN}/health" || failed=1
          check "https://staging.${DOMAIN}/api/health"    || failed=1

          exit $failed

  notify-staging-ready:
    name: Notify Staging Success
    needs: [health-check]
    if: success()
    uses: ./.github/workflows/discord-notify.yml
    with:
      status: "Success"
      message: "Staging environment is updated and passing health checks!"
    secrets: inherit

  notify-ci-failure:
    name: Notify CI/CD Failure
    needs: [ci, docker-staging, docker-release]
    if: failure()
    uses: ./.github/workflows/discord-notify.yml
    with:
      status: "Failure"
      message: "The pipeline failed during CI or Docker Build. Check the GitHub Actions logs."
    secrets: inherit
