name: CI / CD Pipeline

on:
  push:
    branches:
      - main
      - feat/devops-fixes
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    # environment:
    #   name: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    permissions:
      contents: read
      checks: write
    outputs:
      status: ${{ job.status }}
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: ${{ startsWith(github.ref, 'refs/tags/v') && format('https://{0}/api', secrets.PROD_DOMAIN) || format('https://staging.{0}/api', secrets.STAGING_DOMAIN) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      # - name: Setup Just
      #   uses: extractions/setup-just@v2

