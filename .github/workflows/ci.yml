name: CI / CD Pipeline

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    outputs:
      status: ${{ job.status }}
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: ${{ startsWith(github.ref, 'refs/tags/v') && format('https://{0}/api', secrets.PROD_DOMAIN) || format('https://staging.{0}/api', secrets.STAGING_DOMAIN) }}
      CI_BACKEND_IMAGE: umtas-ci-backend:${{ github.sha }}
      CI_PDF_PARSER_IMAGE: umtas-ci-pdf-parser:${{ github.sha }}
      CI_SOLVER_IMAGE: umtas-ci-solver:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Setup Just
        uses: extractions/setup-just@v2

      - name: Enable Corepack (pnpm)
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate observability configuration and alert transitions
        run: |
          docker run --rm -v "$PWD/infra/prometheus:/etc/prometheus:ro" --entrypoint /bin/promtool prom/prometheus:v3.4.0 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/infra/prometheus:/etc/prometheus:ro" --entrypoint /bin/promtool prom/prometheus:v3.4.0 test rules /etc/prometheus/alerts.test.yml
          docker run --rm -v "$PWD/infra/alertmanager:/etc/alertmanager:ro" --entrypoint /bin/amtool prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml

      - name: Verify deployment and rollback contracts
        run: python3 infra/scripts/test_devops.py

      - name: Run Linter
        run: pnpm run lint

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build WASM package
        run: wasm-pack build apps/frontend/wasm-engine --target web --release

      - name: Run Build
        run: pnpm run build

      - name: Run production dependency audit
        run: pnpm audit --audit-level=moderate --prod

      - name: Run Unit Tests
        run: |
          pnpm --filter shared-types test
          pnpm --filter bullmq-worker-core test
          pnpm --filter solver-worker test
          pnpm --filter pdf-parser-worker test
          pnpm --filter backend exec jest --coverage --runInBand

      - name: Typecheck Full-Stack Integration Tests
        run: pnpm --filter backend test:integration:typecheck

      - name: Build integration images in parallel
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          files: ./docker-bake.hcl
          load: true

      - name: Run Full-Stack Integration Tests
        run: pnpm test:integration

      - name: Run Browser E2E Tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 30

      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/backend/coverage/lcov.info
          disable_search: true
          flags: unit

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "**/junit.xml"

  pr-image-scan:
    name: Scan PR images
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            dockerfile: docker/backend/backend.Dockerfile
            cache: backend-staging
          - service: frontend
            dockerfile: docker/frontend/frontend.Dockerfile
            cache: frontend-staging
          - service: solver-worker
            dockerfile: docker/solver-worker/solver-worker.Dockerfile
            cache: solver-worker-staging
          - service: pdf-parser-worker
            dockerfile: docker/pdf-parser-worker/pdf-parser-worker.Dockerfile
            cache: pdf-parser-staging
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          build-args: SKIP_ML_MODELS=1
          tags: umtas-pr-scan:${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.cache }}

      - name: Scan for vulnerabilities
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          mkdir -p reports
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/reports:/reports" -v "$PWD/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy:0.75.0 image --ignorefile /.trivyignore \
            --scanners vuln --severity HIGH,CRITICAL --format json \
            --output "/reports/$SERVICE.json" "umtas-pr-scan:$SERVICE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy:0.75.0 image --ignorefile /.trivyignore \
            --scanners vuln --severity CRITICAL --exit-code 1 \
            "umtas-pr-scan:$SERVICE"

      - name: Keep vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-vulnerabilities-${{ matrix.service }}
          path: reports/
          retention-days: 14

  docker-staging:
    name: Build & Push Staging Images
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    environment:
      name: staging
    permissions:
      contents: read
    outputs:
      status: ${{ job.status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tags
        id: tag
        run: |
          echo "latest=latest" >> $GITHUB_OUTPUT
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/backend/backend.Dockerfile
          build-args: APP_COMMIT=${{ github.sha }}
          push: true
          sbom: true
          provenance: mode=min
          tags: |
            vigilcs/umtas:backend-staging-${{ steps.tag.outputs.latest }}
            vigilcs/umtas:backend-staging-${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=backend-staging
          cache-to: type=gha,mode=max,scope=backend-staging

      - name: Build & push frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/frontend/frontend.Dockerfile
          push: true
          sbom: true
          provenance: mode=min
          build-args: |
            NEXT_PUBLIC_POSTHOG_PT=${{ secrets.NEXT_PUBLIC_POSTHOG_PT }}
            NEXT_PUBLIC_POSTHOG_API_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_API_HOST}}
            NEXT_PUBLIC_APP_ENV=staging
            NEXT_PUBLIC_API_URL=https://staging.capstone-vigil.dns.net.za/api
            NEXT_PUBLIC_MAP_KEY=${{ secrets.NEXT_PUBLIC_MAP_KEY }}
            NEXT_PUBLIC_MAP_ID=${{ secrets.NEXT_PUBLIC_MAP_ID }}
            ORS_API_KEY=${{ secrets.ORS_API_KEY }}
          tags: |
            vigilcs/umtas:frontend-staging-${{ steps.tag.outputs.latest }}
            vigilcs/umtas:frontend-staging-${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=frontend-staging
          cache-to: type=gha,mode=max,scope=frontend-staging

      - name: Build & push solver
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/solver-worker/solver-worker.Dockerfile
          push: true
          sbom: true
          provenance: mode=min
          tags: |
            vigilcs/umtas:solver-worker-staging-${{ steps.tag.outputs.latest }}
            vigilcs/umtas:solver-worker-staging-${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=solver-worker-staging
          cache-to: type=gha,mode=max,scope=solver-worker-staging

      - name: Build & push pdf-parser
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/pdf-parser-worker/pdf-parser-worker.Dockerfile
          push: true
          sbom: true
          provenance: mode=min
          tags: |
            vigilcs/umtas:pdf-parser-worker-staging-${{ steps.tag.outputs.latest }}
            vigilcs/umtas:pdf-parser-worker-staging-${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=pdf-parser-staging
          cache-to: type=gha,mode=max,scope=pdf-parser-staging

  deploy-staging:
    runs-on: ubuntu-latest
    name: Deploy to Staging
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    needs: [docker-staging, image-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    environment:
      name: staging
    permissions: {}
    steps:
      - name: Execute deployment on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          port: ${{ secrets.PROD_SSH_PORT }}
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -eu
            cd /opt/UMTAS
            export IMAGE_TAG=${{ github.sha }}
            IMAGE_TAG=$(printf '%s' "$IMAGE_TAG" | cut -c1-7)
            export IMAGE_TAG
            phase run --env staging -- docker compose -p umtas-staging -f docker-compose.staging.yml pull
            phase run --env staging -- docker compose -p umtas-staging -f docker-compose.staging.yml run --rm backend node dist/db/migrate.js
            phase run --env staging -- docker compose -p umtas-staging -f docker-compose.staging.yml up -d --wait --wait-timeout 180
            python3 infra/scripts/verify-deployment.py https://staging.capstone-vigil.dns.net.za "staging-$IMAGE_TAG"

  docker-release:
    name: Build & Push Release Images
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
    permissions:
      contents: read
    outputs:
      status: ${{ job.status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve release tag
        id: tag
        run: |
          echo "release=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/backend/backend.Dockerfile
          build-args: APP_COMMIT=${{ github.sha }}
          push: true
          sbom: true
          provenance: mode=min
          tags: |
            vigilcs/umtas:backend-${{ steps.tag.outputs.release }}
            vigilcs/umtas:backend-${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=backend-release
          cache-to: type=gha,mode=max,scope=backend-release

      - name: Build & push frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/frontend/frontend.Dockerfile
          push: true
          sbom: true
          provenance: mode=min
          build-args: |
            NEXT_PUBLIC_POSTHOG_PT=${{ secrets.NEXT_PUBLIC_POSTHOG_PT }}
            NEXT_PUBLIC_POSTHOG_API_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_API_HOST}}
            NEXT_PUBLIC_APP_ENV=production
            NEXT_PUBLIC_API_URL=https://capstone-vigil.dns.net.za/api
            NEXT_PUBLIC_MAP_KEY=${{ secrets.NEXT_PUBLIC_MAP_KEY }}
            NEXT_PUBLIC_MAP_ID=${{ secrets.NEXT_PUBLIC_MAP_ID }}
            ORS_API_KEY=${{ secrets.ORS_API_KEY }}
          tags: |
            vigilcs/umtas:frontend-${{ steps.tag.outputs.release }}
            vigilcs/umtas:frontend-${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=frontend-release
          cache-to: type=gha,mode=max,scope=frontend-release

      - name: Build & push solver
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/solver-worker/solver-worker.Dockerfile
          push: true
          sbom: true
          provenance: mode=min
          tags: |
            vigilcs/umtas:solver-worker-${{ steps.tag.outputs.release }}
            vigilcs/umtas:solver-worker-${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=solver-release
          cache-to: type=gha,mode=max,scope=solver-release

      - name: Build & push pdf-parser
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/pdf-parser-worker/pdf-parser-worker.Dockerfile
          push: true
          sbom: true
          provenance: mode=min
          tags: |
            vigilcs/umtas:pdf-parser-worker-${{ steps.tag.outputs.release }}
            vigilcs/umtas:pdf-parser-worker-${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=pdf-parser-release
          cache-to: type=gha,mode=max,scope=pdf-parser-release

  image-scan:
    name: Scan application images
    runs-on: ubuntu-latest
    needs: [docker-staging, docker-release]
    if: ${{ always() && (needs.docker-staging.result == 'success' || needs.docker-release.result == 'success') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, solver-worker, pdf-parser-worker]
    steps:
      - name: Checkout trivyignore
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          sparse-checkout: .trivyignore
          sparse-checkout-cone-mode: false
      - name: Scan for vulnerabilities
        env:
          SERVICE: ${{ matrix.service }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          else
            tag="staging-${GITHUB_SHA::7}"
          fi
          mkdir -p reports
          docker run --rm -v "$PWD/reports:/reports" -v "$PWD/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy:0.75.0 image --ignorefile /.trivyignore \
            --scanners vuln --severity HIGH,CRITICAL --format json \
            --output "/reports/$SERVICE.json" "vigilcs/umtas:$SERVICE-$tag"
          docker run --rm -v "$PWD/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy:0.75.0 image --ignorefile /.trivyignore \
            --scanners vuln --severity CRITICAL --exit-code 1 \
            "vigilcs/umtas:$SERVICE-$tag"
      - name: Keep vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vulnerabilities-${{ matrix.service }}
          path: reports/
          retention-days: 30

  notify-ci-failure:
    name: Notify CI/CD Failure
    needs: [ci, docker-staging, docker-release, image-scan, deploy-staging]
    if: failure()
    uses: ./.github/workflows/discord-notify.yml
    with:
      status: "Failure"
      message: "The pipeline failed during CI or Docker Build. Check the GitHub Actions logs."
    secrets: inherit
