      #     pnpm --filter bullmq-worker-core test
      #     pnpm --filter solver-worker test
      #     pnpm --filter pdf-parser-worker test
      #     pnpm --filter backend exec jest --coverage --runInBand

      # - name: Run Full-Stack Integration Tests
      #   run: pnpm test:integration

      # - name: Run Browser E2E Tests
      #   run: pnpm test:e2e

      # - name: Upload Playwright report
      #   if: ${{ !cancelled() }}
      #   uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      #   with:
      #     name: playwright-report
      #     path: |
      #       apps/e2e/playwright-report
      #       apps/e2e/test-results
      #     retention-days: 30

      # - name: Upload coverage reports to Codecov
      #   uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     files: apps/backend/coverage/lcov.info,apps/backend/coverage/integration/lcov.info
      #     disable_search: true

      # - name: Upload test results to Codecov
      #   if: ${{ !cancelled() }}
      #   uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     files: "**/junit.xml"

  docker-check:
    name: Validate Docker Builds (PR)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: umtas_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/backend/backend.Dockerfile
          push: false
          load: true
          tags: umtas-backend:ci
          cache-from: type=gha,scope=backend-main

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/frontend/frontend.Dockerfile
          push: false
          load: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://staging.${{ secrets.STAGING_DOMAIN }}/api
          tags: umtas-frontend:ci
          cache-from: type=gha,scope=frontend-main

  docker-staging:
    name: Build & Push Staging Images
    runs-on: ubuntu-latest
    # needs: ci
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    environment:
      name: staging
    permissions:
      contents: read
    outputs:
      status: ${{ job.status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tags
        id: tag
        run: |
          echo "latest=latest" >> $GITHUB_OUTPUT
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/backend/backend.Dockerfile
          push: true
          tags: |
            vigilcs/umtas:backend-staging-${{ steps.tag.outputs.latest }}
            vigilcs/umtas:backend-staging-${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=backend-staging
          cache-to: type=gha,mode=max,scope=backend-staging

      - name: Build & push frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/frontend/frontend.Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_POSTHOG_PT=${{ secrets.NEXT_PUBLIC_POSTHOG_PT }}
            NEXT_PUBLIC_POSTHOG_API_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_API_HOST}}
            NEXT_PUBLIC_APP_ENV=staging
            NEXT_PUBLIC_API_URL=https://staging.capstone-vigil.dns.net.za/api
          tags: |
            vigilcs/umtas:frontend-staging-${{ steps.tag.outputs.latest }}
            vigilcs/umtas:frontend-staging-${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=frontend-staging
          cache-to: type=gha,mode=max,scope=frontend-staging

      # - name: Build & push solver
      #   uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      #   with:
      #     context: .
      #     file: docker/solver-worker/solver-worker.Dockerfile
      #     push: true
      #     tags: |
      #       vigilcs/umtas:solver-worker-staging-${{ steps.tag.outputs.latest }}
      #       vigilcs/umtas:solver-worker-staging-${{ steps.tag.outputs.sha }}
      #     cache-from: type=gha,scope=solver-worker-staging
      #     cache-to: type=gha,mode=max,scope=solver-worker-staging

      # - name: Build & push pdf-parser
      #   uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      #   with:
      #     context: .
      #     file: docker/pdf-parser-worker/pdf-parser-worker.Dockerfile
      #     push: true
      #     tags: |
      #       vigilcs/umtas:pdf-parser-worker-staging-${{ steps.tag.outputs.latest }}
      #       vigilcs/umtas:pdf-parser-worker-staging-${{ steps.tag.outputs.sha }}
      #     cache-from: type=gha,scope=pdf-parser-staging
      #     cache-to: type=gha,mode=max,scope=pdf-parser-staging

  deploy-staging:
    runs-on: ubuntu-latest
    name: Deploy to Staging
    needs: docker-staging
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    environment:
      name: production
    permissions: {}
    steps:
      - name: Execute deployment on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          port: ${{ secrets.PROD_SSH_PORT }}
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/UMTAS
            docker compose -f docker-compose.staging.yml up -d --pull always
            just staging-up

