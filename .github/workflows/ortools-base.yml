name: Publish OR-Tools Base Image

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - docker/solver-worker/ortools-base.Dockerfile

permissions: {}

jobs:
  publish:
    name: Publish multi-architecture OR-Tools base image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push OR-Tools base image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/solver-worker/ortools-base.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: vigilcs/umtas:ortools-base-9.12.4544
