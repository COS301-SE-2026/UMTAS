name: umtas-integration

networks:
  integration:
    internal: true

volumes:
  postgres-data:
  redis-data:
  minio-data:

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - integration
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - integration
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2023-10-25T06-33-25Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - integration
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/ready']
      interval: 2s
      timeout: 3s
      retries: 30

  mailhog:
    image: mailhog/mailhog:v1.0.1
    networks:
      - integration

  backend:
    build:
      context: ../../../..
      dockerfile: docker/backend/backend.Dockerfile
    environment:
      PORT: '3000'
      NODE_ENV: test
      DB_MODE: DATABASE
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      SEED: 'FALSE'
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: http://backend:3000/api/auth
      BETTER_AUTH_TRUSTED_ORIGINS: http://backend:3000
      CORS_ORIGIN: http://backend:3000
      NEXT_PUBLIC_APP_URL: http://backend:3000
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      WORKER_CALLBACK_TOKEN: ${WORKER_CALLBACK_TOKEN}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: umtas-uploads
      SMTP_HOST: mailhog
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      SMTP_FROM: UMTAS Full Stack <noreply@test.umtas.local>
    networks:
      - integration
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''http'').get(''http://127.0.0.1:3000/health'',r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 3s
      timeout: 3s
      start_period: 15s
      retries: 30

  pdf-parser-worker:
    build:
      context: ../../../..
      dockerfile: docker/pdf-parser-worker/pdf-parser-worker.Dockerfile
    init: true
    environment:
      NODE_ENV: test
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      WORKER_BACKEND_URL: http://backend:3000
      WORKER_CALLBACK_TOKEN: ${WORKER_CALLBACK_TOKEN}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: umtas-uploads
      PDF_PARSE_CLI_COMMAND: python3
      PDF_PARSE_CLI_CWD: /app/python
      WORKER_READY_FILE: /tmp/umtas-worker/pdf-parser-ready
    networks:
      - integration
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('fs').accessSync(process.env.WORKER_READY_FILE)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 90s

  solver-worker:
    build:
      context: ../../../..
      dockerfile: docker/solver-worker/solver-worker.Dockerfile
    init: true
    environment:
      NODE_ENV: test
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      WORKER_BACKEND_URL: http://backend:3000
      WORKER_CALLBACK_TOKEN: ${WORKER_CALLBACK_TOKEN}
      SOLVER_CLI_COMMAND: /app/bin/solver-cli
      WORKER_READY_FILE: /tmp/umtas-worker/solver-ready
    networks:
      - integration
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('fs').accessSync(process.env.WORKER_READY_FILE)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 330s

  test-runner:
    build:
      context: ../../../..
      dockerfile: apps/backend/test/integration-runner/Dockerfile
    environment:
      CI: '1'
      NODE_OPTIONS: --experimental-vm-modules
      DB_MODE: DATABASE
      FULL_STACK_BACKEND_URL: http://backend:3000
      FULL_STACK_MAILHOG_URL: http://mailhog:8025
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: umtas-uploads
    volumes:
      - ./test-results:/workspace/apps/backend/test/integration-runner/test-results
    networks:
      - integration
    depends_on:
      backend:
        condition: service_healthy
      pdf-parser-worker:
        condition: service_healthy
      solver-worker:
        condition: service_healthy
