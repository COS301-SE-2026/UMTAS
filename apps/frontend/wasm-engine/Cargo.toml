[package]
name = "wasm-engine"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
console_error_panic_hook = "0.1.7"
fast_image_resize = { version = "6.1.0", default-features = false, features = ["no_std"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
image = { version = "0.24", default-features = false }
js-sys = "0.3.105"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen = "0.2.128"
web-sys = { version = "0.3.105", features = ["console", "ImageData", "HtmlCanvasElement", "CanvasRenderingContext2d"] }
wgpu = "30.0.1"
futures-channel = "0.3"
