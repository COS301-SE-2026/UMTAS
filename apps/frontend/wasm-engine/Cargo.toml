[package]
name = "wasm-engine"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3.105"
tract = "0.23.7"
wasm-bindgen = "0.2.128"
web-sys = { version = "0.3.105", features = ["console", "ImageData", "HtmlCanvasElement", "CanvasRenderingContext2d"] }
